[project]
name = "teaching-design-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlmodel>=0.0.22",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "cryptography>=43.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]
# DATABASE_URL is what picks the database; this installs the driver a
# postgresql:// URL needs. SQLite deployments do not pay for it.
postgres = [
  "psycopg[binary]>=3.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
