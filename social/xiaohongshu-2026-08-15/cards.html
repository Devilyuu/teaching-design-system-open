<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能备课系统·小红书图卡</title>
  <style>
    :root {
      --blue: #2452c7;
      --blue-deep: #1f43b3;
      --mist: #eef3fb;
      --ink: #1e2430;
      --muted: #56647a;
      --line: #d5deed;
      --orange: #ff6b2b;
      --green: #168052;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 1600px;
      margin: 0;
      overflow: hidden;
      background: var(--mist);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      color: var(--ink);
    }

    .card {
      position: relative;
      width: 1200px;
      height: 1600px;
      padding: 92px 72px 68px;
      overflow: hidden;
      background:
        radial-gradient(circle at 105% -5%, rgba(36, 82, 199, .14), transparent 34%),
        linear-gradient(180deg, #f8faff 0%, #eef3fb 100%);
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 100%;
      background: var(--blue);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .identity {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: var(--blue-deep);
      font-size: 25px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .identity-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      color: #fff;
      background: var(--blue);
      border-radius: 10px;
      font-size: 25px;
      line-height: 1;
    }

    .page-no {
      color: var(--muted);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .kicker {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 16px;
      color: var(--blue-deep);
      background: #e6edff;
      border-radius: 999px;
      font-size: 22px;
      font-weight: 700;
    }

    h1 {
      max-width: 1020px;
      margin: 0;
      font-size: 64px;
      line-height: 1.22;
      letter-spacing: -.035em;
    }

    .lead {
      max-width: 980px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 29px;
      line-height: 1.65;
    }

    .shot-wrap {
      position: relative;
      margin-top: 58px;
      padding: 12px;
      background: #fff;
      border: 1px solid rgba(36, 82, 199, .18);
      border-radius: 22px;
      box-shadow: 0 28px 70px rgba(31, 67, 179, .15);
      overflow: hidden;
    }

    .shot-wrap img {
      display: block;
      width: 100%;
      height: 650px;
      object-fit: cover;
      object-position: top center;
      border-radius: 13px;
    }

    .caption {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
    }

    .tag {
      padding: 11px 18px;
      color: var(--blue-deep);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 22px;
      font-weight: 600;
    }

    .footnote {
      position: absolute;
      left: 72px;
      bottom: 48px;
      color: #718097;
      font-size: 19px;
    }

    .cover h1 { font-size: 72px; }
    .cover .lead { max-width: 900px; font-size: 31px; }
    .cover .shot-wrap { margin-top: 64px; transform: rotate(-1deg); }
    .cover .shot-wrap::after {
      content: "真实系统截图 · 演示数据已脱敏";
      position: absolute;
      right: 28px;
      bottom: 28px;
      padding: 10px 16px;
      color: #fff;
      background: rgba(31, 36, 48, .76);
      border-radius: 8px;
      font-size: 18px;
    }

    .accent { color: var(--blue); }

    .cta {
      display: grid;
      align-content: center;
      height: 100%;
      padding-bottom: 130px;
    }

    .cta h1 { font-size: 78px; }
    .cta .lead { font-size: 32px; }

    .feature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 64px;
    }

    .feature {
      min-height: 150px;
      padding: 30px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      font-size: 27px;
      font-weight: 700;
      line-height: 1.5;
    }

    .feature small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 400;
    }

    .github {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 52px;
      padding: 18px 28px;
      color: #fff;
      background: var(--blue);
      border-radius: 8px;
      font-size: 28px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const cards = [
      {
        className: "cover",
        kicker: "高校教师 × Vibe Coding",
        title: "我给自己做了一套<br><span class='accent'>智能备课系统</span>",
        lead: "把备课里最费时的资料整理、依据核对和 Word 套模板，尽量交给系统处理。",
        image: "01-dashboard-raw.png",
        tags: ["教师自用工具", "GitHub 开源", "真实场景验证"]
      },
      {
        kicker: "01 / 学期工作台",
        title: "一门课备到哪了，<br>打开就能看懂",
        lead: "下一次课、待处理事项、大纲和教案进度放在同一个教师工作台里。",
        image: "01-dashboard-raw.png",
        tags: ["下一次课", "待备课项", "课程进度"]
      },
      {
        kicker: "02 / 生成前先核对",
        title: "先确认依据，<br>再让 AI 生成",
        lead: "系统会整理人才培养方案、课程标准、教务课表和学校 Word 模板，资料不齐就不往下生成。",
        image: "03-materials-raw.png",
        tags: ["课程标准", "教务课表", "学校模板", "可追溯"]
      },
      {
        kicker: "03 / 整门课规划",
        title: "从课程标准，<br>拆到每一次课",
        lead: "先生成整门课的实施大纲，再由教师调整日期、主题、教学内容和目标对应关系。",
        image: "04-outline-raw.png",
        tags: ["课次规划", "目标代码", "能力指标", "自动校验"]
      },
      {
        kicker: "04 / 教案生成与修改",
        title: "整门课生成，<br>每次课都能细改",
        lead: "15 次课可以分别检查教学目标、重难点和教学过程；不满意的字段再单独让 AI 重写。",
        image: "05-lessons-raw.png",
        tags: ["整门课教案", "逐课次编辑", "单项重写", "Word 导出"]
      },
      {
        kicker: "05 / 单次课备课",
        title: "教案、作业和测试，<br>收进同一个课次",
        lead: "进入某一次课，就能继续调整教案，并按难度和预计用时生成作业或测试。",
        image: "06-session-raw.png",
        tags: ["单次课工作区", "作业", "测试", "难度与用时"]
      },
      {
        kicker: "06 / 课后一分钟",
        title: "上完课的反思，<br>不要等到期末再想",
        lead: "记录授课进度、学生掌握和课堂效果，教师确认后的调整会接到下一次课的教案。",
        image: "07-reflection-raw.png",
        tags: ["约 1 分钟", "授课进度", "学生掌握", "下次课调整"]
      },
      {
        className: "cta",
        kicker: "GitHub 已开源",
        title: "它还不是完美产品，<br><span class='accent'>欢迎一起打磨</span>",
        lead: "仓库中的教学资料已做脱敏处理。不同学校的课程标准、课表和 Word 模板格式各不相同，也正因为如此，更需要高校教师的真实反馈。",
        features: [
          ["试用体验", "告诉我哪一步最卡手"],
          ["提交建议", "欢迎在 GitHub 提 Issue"],
          ["学校适配", "一起兼容更多模板与课表"],
          ["功能共建", "让工具更贴近真实教学流程"]
        ]
      }
    ];

    const requested = Number(new URLSearchParams(location.search).get("card") || 1);
    const index = Math.min(Math.max(requested, 1), cards.length) - 1;
    const item = cards[index];
    const page = String(index + 1).padStart(2, "0");
    const total = String(cards.length).padStart(2, "0");

    const standard = `
      <section class="card ${item.className || ""}">
        <div class="topline">
          <div class="identity"><span class="identity-mark">备</span><span>智能备课系统</span></div>
          <div class="page-no">${page} / ${total}</div>
        </div>
        <div class="kicker">${item.kicker}</div>
        <h1>${item.title}</h1>
        <p class="lead">${item.lead}</p>
        <div class="shot-wrap"><img src="${item.image}" alt="脱敏后的系统截图" /></div>
        <div class="caption">${(item.tags || []).map(tag => `<span class="tag">${tag}</span>`).join("")}</div>
        <div class="footnote">高校教师的 Vibe Coding 作品 · 画面使用脱敏演示数据</div>
      </section>`;

    const ending = `
      <section class="card cta">
        <div class="topline">
          <div class="identity"><span class="identity-mark">备</span><span>智能备课系统</span></div>
          <div class="page-no">${page} / ${total}</div>
        </div>
        <div class="cta">
          <div class="kicker">${item.kicker}</div>
          <h1>${item.title}</h1>
          <p class="lead">${item.lead}</p>
          <div class="feature-grid">
            ${(item.features || []).map(([title, desc]) => `<div class="feature">${title}<small>${desc}</small></div>`).join("")}
          </div>
          <div class="github">欢迎试用 · 建议 · 共建</div>
        </div>
        <div class="footnote">仓库链接可放在小红书正文或主页置顶评论</div>
      </section>`;

    document.getElementById("app").innerHTML = item.features ? ending : standard;
  </script>
</body>
</html>
